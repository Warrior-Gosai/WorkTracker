spring:
  application:
    name: devwork-tracker-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/devwork_tracker_dev}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080
  
